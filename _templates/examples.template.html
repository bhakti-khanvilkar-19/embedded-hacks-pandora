<!--
  TEMPLATE: examples.html
  Only create this file when a topic genuinely has enough code worth
  separating out from the main concepts page. Copy to
  <domain>/<topic>/examples.html and fill in {{PLACEHOLDER}}s.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{Topic}} examples — {{Domain}} — Embedded Pandora</title>
<meta name="description" content="{{One sentence describing these examples.}}" />
<script>(function(){try{var t=localStorage.getItem('ep-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body>
<div id="site-header"></div>
<nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>

<main class="page">
  <p class="kicker">{{Domain}} / {{Topic}}</p>
  <h1>Examples</h1>

  <h2>{{Example title}}</h2>
  <pre><code>{{code}}</code></pre>

  <div class="callout callout--note">
    <span class="callout__label">What I learned</span>
    <p>{{Insight specific to this example.}}</p>
  </div>

  <section class="related" id="related"></section>
  <nav class="pager" id="pager" aria-label="Topic navigation"></nav>
</main>

<script type="application/json" id="page-meta">
{
  "prev": { "href": "/{{domain}}/{{topic}}/index.html", "title": "{{Topic}} overview" },
  "related": [
    { "href": "/{{domain}}/{{topic}}/index.html", "title": "{{Topic}} overview" }
  ]
}
</script>

<div id="site-footer"></div>
<script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/includes.js" defer></script>
</body>
</html>
